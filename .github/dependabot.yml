version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 3
    allow:
      - dependency-type: 'direct'
    cooldown:
      default-days: 2
    commit-message:
      prefix: 'chore(package.json):'
    groups:
      # @vitest/* pin an exact peer on vitest, so separate PRs fail `npm ci`.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      # react-dom peers on a matching react minor; a split major bump conflicts.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # Both are pinned to the same exact version and drift if bumped alone.
      next:
        patterns:
          - 'next'
          - 'eslint-config-next'

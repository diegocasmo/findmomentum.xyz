version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 3
    allow:
      - dependency-type: 'direct'
    cooldown:
      default-days: 2
    commit-message:
      prefix: 'chore(package.json):'
    groups:
      # @vitest/* pin an exact peer on vitest, so separate PRs fail `npm ci`.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'

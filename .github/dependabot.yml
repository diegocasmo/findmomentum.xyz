version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 3
    allow:
      - dependency-type: 'direct'
    cooldown:
      default-days: 2
      semver-major-days: 7
      semver-minor-days: 2
      semver-patch-days: 2
    commit-message:
      prefix: 'chore(package.json):'
